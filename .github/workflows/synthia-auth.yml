name: Synthia auth and web checks

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/ui/**"
      - "services/**"
      - "scripts/smoke_synthia_live3.py"
      - "tests/test_web_auth.py"
      - ".github/workflows/synthia-auth.yml"
  push:
    branches: [ "fix/synthia-vercel-voice-packaging" ]

jobs:
  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  browser-auth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m compileall -q services scripts/smoke_synthia_live3.py
      - run: pytest -q tests/test_web_auth.py
