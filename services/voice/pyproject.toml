[project]
name = "os1-voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,fishaudio,openai,silero,turn-detector]>=1.8.13",
    "livekit-api>=1.2.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
