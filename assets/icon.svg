<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="coralGlow" cx="50%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#e06a4c"/>
      <stop offset="58%" stop-color="#cd4f33"/>
      <stop offset="100%" stop-color="#a84832"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#coralGlow)"/>
  <!-- Gossamer echo strand -->
  <path
    d="M24 64 C24 46, 46 46, 64 64 C82 82, 104 82, 104 64 C104 46, 82 46, 64 64 C46 82, 24 82, 24 64 Z"
    stroke="#fffdf9"
    stroke-opacity="0.32"
    stroke-width="2"
    stroke-linecap="round"
    transform="rotate(-5 64 64)"
  />
  <!-- Primary luminous OS1 infinity ribbon -->
  <path
    d="M24 64 C24 47, 46 47, 64 64 C82 81, 104 81, 104 64 C104 47, 82 47, 64 64 C46 81, 24 81, 24 64 Z"
    stroke="#fffdf9"
    stroke-width="3.6"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />
</svg>
